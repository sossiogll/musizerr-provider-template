name: publish

# Every push to dev publishes the provider when its version has no image yet: it runs the tests, pushes
# ghcr.io/<owner>/musizerr-provider-<name>:<version> for linux/amd64 and linux/arm64 (scripts/publish.sh), pins it
# in catalog.json and commits catalog.json to dev. A push that does not raise the version (catalog.json alone, a
# script, the README) publishes nothing. master is never written here: catalog.json reaches it with the next pull
# request from dev, and master's catalog.json is the one Musizerr instances read.
on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write # the commit of catalog.json
  packages: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the commit of catalog.json may have to be rebased on a dev that moved
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: is the version published
        id: check
        shell: bash
        run: |
          set -euo pipefail
          state=$(IMAGE_NAMESPACE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" scripts/publish.sh --check)
          echo "$state"
          echo "missing=$([ "${state%% *}" = missing ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - run: scripts/test.sh
        if: steps.check.outputs.missing == 'true'
      - uses: docker/setup-qemu-action@v3
        if: steps.check.outputs.missing == 'true'
      - name: publish the image and write its catalog entry
        if: steps.check.outputs.missing == 'true'
        shell: bash
        run: IMAGE_NAMESPACE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" scripts/publish.sh
      # Also after a failure: an image that was pushed is pinned, else it never would be (its version is
      # published, so no later run publishes it again).
      - name: commit catalog.json to dev
        if: ${{ !cancelled() && steps.check.outputs.missing == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          { git show HEAD:catalog.json 2>/dev/null || echo '{"providers": []}'; } > "$RUNNER_TEMP/before.json"
          published=$(jq -r --slurpfile before "$RUNNER_TEMP/before.json" '
            ([$before[0].providers[] | {(.name): .digest}] | add // {}) as $pinned
            | .providers[] | select($pinned[.name] != .digest) | .name' catalog.json)
          if [ -z "$published" ]; then
            echo "catalog.json unchanged"
            exit 0
          fi
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n 1)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git commit -m "catalog: publish $(printf '%s\n' "$published" | paste -sd ' ' -) $version"
          # dev may have moved meanwhile: put the commit on top of it.
          for attempt in 1 2 3; do
            if git push origin HEAD:refs/heads/dev; then exit 0; fi
            echo "push refused (attempt $attempt): rebasing on dev"
            git pull --rebase origin dev
          done
          echo "::error::could not push catalog.json to dev"
          exit 1
