name: release

# Every push to master (a merged pull request from dev) releases the provider when its version is new: if the
# version in pyproject.toml has no tag <name>-v<version> yet, it creates the tag on the merge commit and the GitHub
# release "<label> <version>", whose notes give the image pinned by its digest (from catalog.json) and the
# permissions it declares (scripts/release.sh). Tags and releases only: nothing is committed.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write # the tag and the release
  packages: read # the digest of the image, checked against catalog.json

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: release
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: tag and release the new version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: IMAGE_NAMESPACE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" scripts/release.sh
