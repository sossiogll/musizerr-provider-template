name: test

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The tests run in the base image (Python and the SDK). While the base image is a private package, give this
      # repository read access to it in the package's settings; once it is public this login is not needed.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: scripts/test.sh

  source-branch:
    name: master takes dev only
    # Changes reach master through a pull request from dev, and only from it (make it a required check of master).
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-latest
    steps:
      - name: the pull request comes from dev of this repository
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REF" != dev ] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::master takes pull requests from dev only (this one is from $HEAD_REPO:$HEAD_REF)"
            exit 1
          fi

  provider-version:
    name: provider version
    # A change of the provider gets a new version: its image is published under it once the change is on dev
    # (publish.yml), and a published version is never published again.
    if: github.event_name == 'pull_request' && github.base_ref == 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # the merge commit of the pull request and dev, its first parent
      - name: a changed provider has a greater version than on dev
        run: scripts/version-check.sh HEAD^1 HEAD
