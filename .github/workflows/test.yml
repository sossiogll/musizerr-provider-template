name: test

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The tests run in the base image (Python and the SDK). While the base image is a private package, give this
      # repository read access to it in the package's settings; once it is public this login is not needed.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: scripts/test.sh
